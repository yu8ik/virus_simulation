  "결함 금지": "결말 금지",
  "유전 형질 개조는 수용량과 증상 심각성에 변동을 줍니다. 핵심 형질을 하나 선택한 후 대립 형질은 각 쌍에서 하나 또는 미선택으로 진행합니다. 이완/수축을 포함한 일반 대립 형질은 모든 핵심과 조합할 수 있습니다. 라우드/스텔스만 가스성을 요구합니다. 카드 아래에 선택한 핵심과의 예상 효과, 기본 수치, 조합 보정 및 최종 적용 수치가 표시됩니다. 수용량을 초과하면 확정할 수 없습니다.": "유전 형질 개조는 수용량과 증상 심각성에 변동을 줍니다. 핵심 형질에 따라, 세부 형질의 효과가 달라집니다.",
